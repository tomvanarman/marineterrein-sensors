<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marineterrein Live Sensors & Cameras Map</title>

    <link rel="icon" href="data:,">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: system-ui, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        #legend {
            position: absolute;
            bottom: 24px;
            right: 12px;
            z-index: 1000;
            background: rgba(255,255,255,0.92);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
            padding: 10px 14px;
            font-size: 12px;
            line-height: 1.6;
            max-width: 250px;
        }

        #legend h4 {
            margin: 0 0 6px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        #legend .legend-row span:last-child {
            letter-spacing: 0.02em;
            font-size: 11px;
        }

        .leaflet-popup-content h4 {
            letter-spacing: 0.04em;
        }

        #legend .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 3px;
        }

        #legend .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 1px 3px rgba(0,0,0,.35);
            flex-shrink: 0;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="legend">
    <h4>Sensor / Camera Types</h4>
    <div class="legend-row">
        <span class="legend-dot" style="background:#ec4899;"></span>
        <span>Visitor Dashboard</span>
    </div>
    <div class="legend-row">
        <span class="legend-dot" style="background:#eab308;"></span>
        <span>Sound Classification</span>
    </div>
    <div class="legend-row">
        <span class="legend-dot" style="background:#06b6d4;"></span>
        <span>Water Temperature</span>
    </div>
    <div class="legend-row">
        <span class="legend-dot" style="background:#8b5cf6;"></span>
        <span>Air Quality</span>
    </div>
        <div class="legend-row">
        <span class="legend-dot" style="background:#f97316;"></span>
        <span>Busyness Counter - MQTT Camera</span>
    </div>
    <div class="legend-row">
        <span class="legend-dot" style="background:#0284c7;"></span>
        <span>Gate Traffic - HuSense Camera</span>
    </div>
    <div class="legend-row">
        <span class="legend-dot" style="background:#ff0000;"></span>
        <span>Vehicle Classification - Teleram</span>
    </div>
</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const PUBLIC_API = "https://data.marineterrein.nl";

    const map = L.map("map", {
        zoomControl: true
    }).setView([52.3730, 4.9158], 17);

    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?api_key=cb1_2ajx_1_ffa26773f61de818a407c46e",
        {
            subdomains: "abcd",
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors &copy; CARTO'
        }
    ).addTo(map);

    const markerGroup = L.layerGroup().addTo(map);

    function createMarkerIcon(color) {
        return L.divIcon({
            className: "",
            html: `
                <div
                    style="
                        width:18px;
                        height:18px;
                        border-radius:50%;
                        background:${color};
                        border:3px solid white;
                        box-sizing:border-box;
                        box-shadow:0 2px 5px rgba(0,0,0,.35);
                    ">
                </div>
            `,
            iconSize: [18,18],
            iconAnchor: [9,9]
        });
    }

    const HARDCODED_STATIONS = {

        abri: {
            label: "ABRI Screen (Visitor Dashboard)",
            coords: [52.3726881,4.9175541],
            color: "#ec4899"
        },

        sound: {
            label: "Sound Level Sensor",
            coords: [52.3728175,4.9166609],
            color: "#eab308"
        },

        foot_main: {
            label: "MMwave - Hoofdingang",
            coords: [52.3725506,4.9178169],
            color: "#0284c7"
        },

        vehicle: {
            label: "Vehicle Classification",
            coords: [52.3731205,4.9167735],
            color: "#ff0000"
        },

        terrace: {
            label: "Busyness Monitor - Terrace Homeland",
            coords: [52.3731254,4.9166904],
            color: "#f97316"
        },

        water: {
            label: "Water Temperature Sensor",
            coords: [52.3732122,4.9144507],
            color: "#06b6d4"
        },

        ams_inst: {
            label: "Busyness Monitor - Kadewest",
            coords: [52.3737029,4.9150122],
            color: "#f97316"
        },

        boardwalk: {
            label: "Busyness Monitor - Boardwalk",
            coords: [52.3725291,4.9153350],
            color: "#f97316"
        },

        picnic: {
            label: "Busyness Monitor - Voorwerf",
            coords: [52.3728910,4.9166064],
            color: "#f97316"
        },

        foot_bridge: {
            label: "MMwave - Commandantsbrug",
            coords: [52.3756498,4.9143518],
            color: "#0284c7"
        },

        foot_oude: {
            label: "MMwave - Oude poort",
            coords: [52.3718495,4.9163502],
            color: "#0284c7"
        },

        air: {
            label: "Air Quality Sensor",
            coords: [52.3724122,4.9174840],
            color: "#8b5cf6"
        }

    };

    async function renderLiveMapMarkers() {

        try {

            const [
                overviewResponse,
                husenseResponse,
                mqttResponse,
                gateResponse
            ] = await Promise.all([
                fetch(`${PUBLIC_API}/api/ops/live/overview`),
                fetch(`${PUBLIC_API}/api/husense/presence`),
                fetch(`${PUBLIC_API}/api/busyness/mqtt`),
                fetch(`${PUBLIC_API}/api/husense/gate-counts`)
            ]);

            if (!overviewResponse.ok)
                throw new Error("Failed to load overview API");

            if (!husenseResponse.ok)
                throw new Error("Failed to load HuSense API");

            if (!mqttResponse.ok)
                throw new Error("Failed to load MQTT API");

            const overview = await overviewResponse.json();
            const husense = await husenseResponse.json();
            const mqtt = await mqttResponse.json();
            const gateCounts = await gateResponse.json();

            // Real backend health status per source (ok/warning/critical/unknown),
            // now staleness-aware server-side -- only covers sources exposed via
            // /api/ops/live/overview's `sources` object (water, sound, air,
            // telraam). HuSense gate traffic and MQTT busyness cameras don't have
            // an equivalent status field from their endpoints, so those markers
            // still fall back to "did a value show up" below.
            const sourceStatus = {
                water: overview.sources?.water?.status,
                sound: overview.sources?.sound?.status,
                air: overview.sources?.air?.status,
                telraam: overview.sources?.telraam?.status,
            };

            markerGroup.clearLayers();

            const stationMap = new Map();

            Object.entries(HARDCODED_STATIONS).forEach(([key, value]) => {

                stationMap.set(key, {
                    ...value,
                    valueTitle: "Value",
                    displayValue: "No data",
                    isActive: false
                });

            });

            //----------------------------------------------------------
            // OVERVIEW API
            //----------------------------------------------------------

            overview.records.forEach(record => {

                switch (record.source) {

                    case "water":

                        if (record.metric === "water_temperature_c") {

                            stationMap.get("water").displayValue =
                                `${record.value} °C`;
                            stationMap.get("water").isActive =
                                sourceStatus.water === "ok";

                        }

                        break;

                    case "sound":

                        if (record.metric === "sound_level_db") {

                            stationMap.get("sound").displayValue =
                                `${Number(record.value).toFixed(1)} dB`;
                            stationMap.get("sound").isActive =
                                sourceStatus.sound === "ok";

                        }
                        
                        break;

                    case "air":

                        if (record.metric === "pm25") {

                            stationMap.get("air").displayValue =
                                `${record.value} μg/m³`;
                            stationMap.get("air").isActive =
                                sourceStatus.air === "ok";

                        }

                        break;

                    case "telraam":

                        if (record.metric === "vehicle_count") {

                            stationMap.get("vehicle").displayValue =
                                `${record.value} vehicles`;
                            stationMap.get("vehicle").isActive =
                                sourceStatus.telraam === "ok";

                        }

                        break;

                }

                //--------------------------------------------------
                // ABRI (if present)
                //--------------------------------------------------

                if (
                    record.source &&
                    record.source.toLowerCase().includes("abri")
                ) {

                    stationMap.get("abri").displayValue =
                        record.value != null
                            ? String(record.value)
                            : "Online";
                    stationMap.get("abri").isActive = true;

                }

            });

            //----------------------------------------------------------
            // HUSENSE PRESENCE
            //----------------------------------------------------------

            gateCounts.forEach(gate => {

                switch (gate.spaceName) {
            
                    case "Marineterrein Hoofd Ingang":
            
                        stationMap.get("foot_main").valueTitle = "Today's traffic";
                        stationMap.get("foot_main").displayValue =
                            `In: ${gate.arrivals}<br>Out: ${gate.departures}`;
                        stationMap.get("foot_main").isActive = true;
            
                        break;
            
                    case "Marineterrein Commandantsbrug":
            
                        stationMap.get("foot_bridge").valueTitle = "Today's traffic";
                        stationMap.get("foot_bridge").displayValue =
                            `In: ${gate.arrivals}<br>Out: ${gate.departures}`;
                        stationMap.get("foot_bridge").isActive = true;
            
                        break;
            
                    case "Marineterrein Oude Poort":
            
                        stationMap.get("foot_oude").valueTitle = "Today's traffic";
                        stationMap.get("foot_oude").displayValue =
                            `In: ${gate.arrivals}<br>Out: ${gate.departures}`;
                        stationMap.get("foot_oude").isActive = true;
            
                        break;
            
                }
            
            });

            //----------------------------------------------------------
            // MQTT BUSYNESS
            //----------------------------------------------------------

            (mqtt.rows || []).forEach(camera => {

                switch (camera.label) {

                    case "Terrace":

                        stationMap.get("terrace").displayValue =
                            `${camera.count} people`;
                        stationMap.get("terrace").isActive = true;

                        break;

                    case "Boardwalk":

                        stationMap.get("boardwalk").displayValue =
                            `${camera.count} people`;
                        stationMap.get("boardwalk").isActive = true;

                        break;

                    case "Picnic":

                        stationMap.get("picnic").displayValue =
                            `${camera.count} people`;
                        stationMap.get("picnic").isActive = true;

                        break;

                    case "Shuttercam":

                        stationMap.get("ams_inst").displayValue =
                            `${camera.count} people`;
                        stationMap.get("ams_inst").isActive = true;

                        break;

                }

            });

            //----------------------------------------------------------
            // SAVE FOR DRAWING
            //----------------------------------------------------------

            window.stationMap = stationMap;

        }

        catch (err) {

            console.error(err);

        }

    }

    //----------------------------------------------------------
    // DRAW MARKERS
    //----------------------------------------------------------

    async function drawMap() {

        await renderLiveMapMarkers();

        markerGroup.clearLayers();

        window.stationMap.forEach(station => {

            const popup = `
                <div style="
                    min-width:190px;
                    font-family:system-ui,sans-serif;
                ">

                    <h4 style="
                        margin:0 0 8px;
                        font-size:14px;
                        font-weight:600;
                    ">
                        ${station.label}
                    </h4>

                    <div style="
                        font-size:13px;
                        margin-bottom:6px;
                    ">
                        <strong>${station.valueTitle}</strong><br>
                        <span style="
                            color:#0284c7;
                            font-weight:600;
                        ">
                            ${station.displayValue}
                        </span>
                    </div>

                    <div style="
                        font-size:11px;
                        color:#666;
                    ">
                        Status:
                        <span style="
                            color:${station.isActive ? '#00ba12' : '#dc2626'};
                            font-weight:600;
                        ">
                            ${station.isActive ? 'Active' : 'No data'}
                        </span>
                    </div>

                </div>
            `;

            L.marker(
                station.coords,
                {
                    icon: createMarkerIcon(station.color)
                }
            )
            .bindTooltip(
                station.label,
                {
                    direction: "top",
                    offset: [0,-6]
                }
            )
            .bindPopup(
                popup,
                {
                    maxWidth: 240
                }
            )
            .addTo(markerGroup);

        });

    }

    //----------------------------------------------------------
    // INITIAL LOAD
    //----------------------------------------------------------

    drawMap();

    //----------------------------------------------------------
    // REFRESH EVERY MINUTE
    //----------------------------------------------------------

    setInterval(drawMap, 60000);

});

</script>

</body>
</html>
